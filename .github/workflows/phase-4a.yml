name: Phase 4A verification
on:
  push:
    branches: [feature/portfolio-studio]
  pull_request:
    branches: [feature/portfolio-studio]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studio_test
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d studio_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Authentication integration
        env:
          DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/phase3b_test
        run: |
          PGPASSWORD=ci-only createdb -h 127.0.0.1 -U postgres phase3b_test
          npm run prisma:migrate
          npm run test:integration
      - run: npm run test:integration:studio
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- --reporter=line --retries=0
