name: Phase 4A verification
on:
  push:
    branches: [feature/portfolio-studio, feature/phase-4b1-public-content]
  pull_request:
    branches: [main, feature/portfolio-studio, feature/phase-4b1-public-content]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studio_test
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/studio_test
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Authentication integration
        env:
          DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/phase3b_test
        run: |
          PGPASSWORD=ci-only createdb -h 127.0.0.1 -U postgres phase3b_test
          npm run prisma:migrate
          npm run test:integration
      - run: npm run test:integration:studio
      - run: npm run test:integration:public
      - name: Rehearse staging configuration on disposable PostgreSQL
        run: node --test integration/staging.cjs
      - name: Download Playwright browsers
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install chromium firefox webkit
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: sudo env PATH="$PATH" DEBIAN_FRONTEND=noninteractive ./node_modules/.bin/playwright install-deps chromium firefox webkit
      - run: npm run test:browser -- --reporter=line --retries=0
