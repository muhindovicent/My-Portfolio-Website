<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Studio</title>
  <link rel="stylesheet" href="/admin/assets/studio.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23f4f1e8' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#studio-main">Skip to content</a>

  <div class="studio" id="studio">
    <aside class="sidebar" id="sidebar" aria-label="Studio navigation" aria-expanded="true">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-text">Portfolio <strong>Studio</strong></span>
        <button class="icon-button sidebar-collapse" type="button" id="collapse-button" aria-label="Collapse navigation" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Sections"></nav>
      <div class="sidebar-footer">
        <a class="sidebar-link" href="/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
          <span>View site</span>
        </a>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="app-body">
      <header class="topbar">
        <button class="icon-button menu-button" type="button" id="menu-button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <form class="topbar-search" role="search" id="search-form">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="search-input">Search content</label>
          <input id="search-input" name="q" type="search" placeholder="Search projects, skills, messages…" autocomplete="off" aria-describedby="search-hint">
          <span class="visually-hidden" id="search-hint">Results appear below as you type.</span>
          <kbd aria-hidden="true">/</kbd>
        </form>

        <div class="topbar-actions">
          <button class="icon-button" type="button" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>

          <div class="notifications" id="notifications">
            <button class="icon-button" type="button" id="notifications-toggle" aria-label="Notifications" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span class="badge" id="notification-badge" hidden></span>
            </button>
            <div class="popover notifications-popover" id="notifications-popover" role="menu" aria-label="Notifications" hidden></div>
          </div>

          <div class="profile-menu" id="profile-menu">
            <button class="profile-button" type="button" id="profile-toggle" aria-label="Administrator profile menu" aria-expanded="false" aria-haspopup="true">
              <span class="avatar" id="profile-avatar" aria-hidden="true">—</span>
              <span class="profile-meta">
                <span class="profile-name" id="profile-name">Administrator</span>
                <span class="profile-email" id="profile-email"></span>
              </span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="popover profile-popover" id="profile-popover" role="menu" aria-label="Profile" hidden>
              <a class="menu-item" href="/admin/security" data-link>Security</a>
              <a class="menu-item" href="/admin/settings" data-link>Settings</a>
              <button class="menu-item danger" type="button" id="logout-button">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="main" id="studio-main" tabindex="-1">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script type="module" src="/admin/assets/app.js"></script>
</body>
</html>
